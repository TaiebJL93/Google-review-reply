services:
  - type: web
    name: reviewreply
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers/--forwarded-allow-ips let uvicorn trust Render's load
    # balancer, so request.url reports https instead of the internal http hop.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Signs the login session cookie. Render generates a random value on
      # first deploy; never reuse the local dev value here.
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      # Neon connection string (postgresql://...). Render's own free Postgres
      # is deleted after 30 days, and the free web tier has no persistent
      # disk, so the database has to live outside Render.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
