<div class="draft-panel">
  <p class="draft-panel__label">Draft reply</p>
  <textarea id="draft-content-{{ review.id }}" class="draft-content" rows="4">{{ review.draft.content }}</textarea>
  <div class="draft-actions">
    <button type="button" class="btn btn-primary btn-sm" data-copy-target="draft-content-{{ review.id }}">Copy</button>
    <button type="button" class="btn btn-ghost btn-sm" data-draft-review-id="{{ review.id }}">Regenerate</button>
  </div>
</div>
